services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: taxmaxi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - taxmaxi_db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
  # Throwaway Postgres for the integration test suite (TEST_PGPORT, default 5433).
  # Kept separate from the dev db so dev config stays closer to prod.
  # Durability is off on purpose: without these flags, the first checkpoint
  # after a test run has to fsync every file the run created (~130k: every
  # table/index file of 35 template-cloned databases, plus a new file per
  # table and index for every per-test TRUNCATE), which kept vitest hanging
  # for 40+ seconds after the last test. No volume: state is disposable and
  # is rebuilt by the test setup on every run.
  db-test:
    image: postgres:18
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_DB: taxmaxi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
volumes:
  taxmaxi_db_data:
